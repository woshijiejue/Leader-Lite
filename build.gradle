import org.apache.commons.lang3.SystemUtils
import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'idea'
    id 'java'
    id 'gg.essential.loom' version '0.10.0.+'
    id 'dev.architectury.architectury-pack200' version '0.1.3'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

//Constants:
def baseGroup = project.property('baseGroup')
def mcVersion = project.property('mcVersion')
def modid = project.property('modid')
def jarName = project.property('jarName')
def mixinGroup = "${baseGroup}.mixin"
def transformerFile = file('src/main/resources/accesstransformer.cfg')

version = project.property('version')

// Toolchains:
java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(8))
}

// Minecraft configuration:
loom {
    log4jConfigs.from(file('log4j2.xml'))

    launchConfigs {
        client {
            // If you don't want mixins, remove these lines
            property('mixin.debug', 'true')
            arg('--tweakClass', 'org.spongepowered.asm.launch.MixinTweaker')
        }
    }

    runConfigs {
        client {
            if (SystemUtils.IS_OS_MAC_OSX) {
                // This argument causes a crash on macOS
                vmArgs.remove('-XstartOnFirstThread')
            }
        }
        remove(getByName('server'))
    }

    forge {
        pack200Provider.set(new dev.architectury.pack200.java.Pack200Adapter())
        // If you don't want mixins, remove these lines
        mixinConfig("mixins.${modid}.json")
        if (transformerFile.exists()) {
            println('Installing access transformer')
            accessTransformer(transformerFile)
        }
    }

    // If you don't want mixins, remove these lines
    mixin {
        defaultRefmapName.set("mixins.${modid}.refmap.json")
    }
}

sourceSets.main {
    output.setResourcesDir(java.classesDirectory)
}

// Dependencies:
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/maven/' }
    // If you don't want to log in with your real minecraft account, remove this line
    maven { url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1' }

    flatDir {
        dirs 'libs'
    }
}

configurations {
    shadowImpl
}
configurations.implementation.extendsFrom(configurations.shadowImpl)

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings 'de.oceanlabs.mcp:mcp_stable:22-1.8.9'
    forge 'net.minecraftforge:forge:1.8.9-11.15.1.2318-1.8.9'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    shadowImpl 'cn.hutool:hutool-http:5.8.25'
    shadowImpl files('libs/openauth-1.1.6.jar')

    // If you don't want mixins, remove these lines
    shadowImpl('org.spongepowered:mixin:0.7.11-SNAPSHOT') {
        transitive = false
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT'
    // If you don't want to log in with your real minecraft account, remove this line
    runtimeOnly 'me.djtheredstoner:DevAuth-forge-legacy:1.2.1'
}

// Tasks:
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveBaseName.set(jarName)
    manifest.attributes(
        'FMLCorePluginContainsFMLMod': 'true',
        'ForceLoadAsMod': 'true',
        // If you don't want mixins, remove these lines
        'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
        'MixinConfigs': "mixins.${modid}.json"
    )
    if (transformerFile.exists()) {
        manifest.attributes(['FMLAT': "${modid}_at.cfg"])
    }
}

processResources {
    inputs.property('version', project.version)
    inputs.property('mcversion', mcVersion)
    inputs.property('modid', modid)
    inputs.property('basePackage', baseGroup)
    filesMatching(['mcmod.info', "mixins.${modid}.json".toString(), 'version.json']) {
        expand(inputs.properties)
    }
    rename('accesstransformer.cfg', "META-INF/${modid}_at.cfg")
}

tasks.named('remapJar', RemapJarTask) {
    archiveClassifier.set('')
    from(tasks.shadowJar)
    input.set(tasks.shadowJar.archiveFile)
}

jar {
    archiveClassifier.set('without-deps')
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
}

shadowJar {
    destinationDirectory.set(layout.buildDirectory.dir('intermediates'))
    archiveClassifier.set('non-obfuscated-with-deps')
    configurations = [project.configurations.shadowImpl]

    doLast {
        configurations.each {
            println("Copying dependencies into mod: ${it.files}")
        }
    }
}

tasks.assemble.dependsOn(tasks.remapJar)
